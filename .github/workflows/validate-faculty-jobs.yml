name: Validate faculty job tracker

on:
  pull_request:
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "xrmemory/**"
      - "data/**"
      - "data-tools/**"
      - "tests/**"
      - ".github/workflows/validate-faculty-jobs.yml"
      - ".github/workflows/refresh-tracker.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "xrmemory/**"
      - "data/**"
      - "data-tools/**"
      - "tests/**"
      - ".github/workflows/validate-faculty-jobs.yml"
      - ".github/workflows/refresh-tracker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate job data and privacy rules
        run: node tests/validate-data.mjs
      - name: Check tracker scripts
        run: |
          node --check data-tools/refresh-tracker.mjs
          node --check data-tools/merge-faculty-jobs.mjs
          node --check data-tools/discover-faculty-jobs.mjs
          node --check data-tools/audit-r1-portals.mjs
          node --check data-tools/run-refresh.mjs
          node --check app.js
      - name: Test tracker refresh logic
        run: |
          node tests/refresh-tracker.mjs
          node tests/discover-faculty-jobs.mjs
          node tests/audit-r1-portals.mjs
          node tests/run-refresh.mjs
