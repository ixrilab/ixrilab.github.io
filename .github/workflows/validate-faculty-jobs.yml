name: Validate faculty job tracker

on:
  pull_request:
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "data/**"
      - "data-tools/**"
      - "tests/**"
      - ".github/workflows/validate-faculty-jobs.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "data/**"
      - "data-tools/**"
      - "tests/**"
      - ".github/workflows/validate-faculty-jobs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate job data and privacy rules
        run: node tests/validate-data.mjs
      - name: Check English normalization script
        run: node --check data-tools/normalize-jobs-to-english.mjs
