name: Validate faculty job tracker

on:
  pull_request:
    paths:
      - "faculty-jobs/**"
      - ".github/workflows/validate-faculty-jobs.yml"
  push:
    branches: [main]
    paths:
      - "faculty-jobs/**"
      - ".github/workflows/validate-faculty-jobs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate job data and privacy rules
        run: node faculty-jobs/tests/validate-data.mjs
