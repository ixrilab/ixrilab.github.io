name: Refresh job and funding tracker

on:
  schedule:
    - cron: "7 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-opportunity-tracker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh faculty, funding, discovery, and coverage independently
        id: refresh
        continue-on-error: true
        run: node data-tools/run-refresh.mjs
      - name: Validate refreshed data
        run: |
          node tests/refresh-tracker.mjs
          node tests/discover-faculty-jobs.mjs
          node tests/audit-r1-portals.mjs
          node tests/run-refresh.mjs
          node tests/validate-data.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "IXRI Lab Tracker Bot"
          git config user.email "ixrilab-tracker-bot@users.noreply.github.com"
          git add data/jobs.json data/funding.json data/faculty-discovery.json data/r1-coverage.json data/refresh-status.json
          if git diff --cached --quiet; then
            echo "No tracker data changed."
            exit 0
          fi
          git commit -m "Refresh opportunity tracker $(date -u +%F)"
          git push
      - name: Publish the updated datasets to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Report a failed stage after saving valid results
        if: steps.refresh.outcome != 'success'
        run: |
          echo "::error::Some sources could not be refreshed. Valid results and data/refresh-status.json were saved; inspect the refresh step for details."
          exit 1
